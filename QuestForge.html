<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  QUESTFORGE — a personal life-planning dashboard as an RPG        ║
  ║  Single-file app: HTML + CSS + JS. No backend, no external images.║
  ║  All data lives in localStorage under ONE key (see STORAGE_KEY).  ║
  ╚══════════════════════════════════════════════════════════════════╝

  FILE MAP (search for the "=====" banners):
    1. STYLES            – themes (CSS variables), layout, components, animations
    2. MARKUP            – static app shell (HUD, nav, main, battle panel)
    3. CORE              – pure game logic, no DOM (XP, levels, streaks, bosses, recap)
                           + built-in self tests (Settings → Run self-tests)
    4. CONTENT           – unlocks, achievements, example data
    5. STORE             – load/save/migrate/export/import
    6. SOUND             – Web Audio synthesised sound effects
    7. ART               – pixel-art painter + all hero/monster/boss sprites
    8. BATTLE            – animated battle panel (canvas + DOM overlay)
    9. FX                – toasts, confetti, popups
   10. UI                – views (Today, Quest Log, Bosses, Shop, Trophies,
                           Inventory, Recap, Settings) and modals
   11. ACTIONS           – everything that changes state
   12. SYNC              – optional cloud sync between devices (Supabase)
   13. BOOT              – startup, midnight rollover, timers
-->

/* difficulty colours (shared across themes) */
:root { --d-trivial:#9aa3b8; --d-easy:#4fc979; --d-medium:#4aa3ff; --d-hard:#b57bff; --d-epic:#ff9f43; }

/* ---- Base ---- */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px; line-height: 1.45; color: var(--text);
  background: radial-gradient(1200px 600px at 60% -10%, var(--bg-glow), transparent 70%), var(--bg);
  overflow: hidden; transition: background-color .4s, color .4s;
}
h1, h2, h3, h4, .pixel { font-family: 'Pixelify Sans', 'Courier New', monospace; font-weight: 600; letter-spacing: .3px; margin: 0; }
h1 { font-size: 28px; } h2 { font-size: 19px; } h3 { font-size: 16px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
::selection { background: var(--accent); color: var(--accent-text); }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.small { font-size: 12px; } .tiny { font-size: 11px; }
.row { display: flex; align-items: center; gap: 8px; } .wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.hidden { display: none !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---- App layout: HUD on top; nav | main | battle panel ---- */
#app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
.layout { display: grid; grid-template-columns: 190px minmax(0, 1fr) 372px; min-height: 0; }
#nav { padding: 16px 10px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; overflow-y: auto; background: color-mix(in srgb, var(--panel) 60%, transparent); }
#main { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }
#side > * { flex-shrink: 0; }
#side { overflow-y: auto; padding: 16px; border-left: 1px solid var(--border); background: color-mix(in srgb, var(--panel) 60%, transparent); display: flex; flex-direction: column; gap: 14px; }

/* ---- HUD ---- */
.hud { display: flex; align-items: center; gap: 22px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 8px; font-family: 'Pixelify Sans', monospace; font-size: 20px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.brand svg { width: 26px; height: 26px; }
.hero-block { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; max-width: 560px; }
.portrait-wrap { position: relative; flex: none; }
.portrait { width: 62px; height: 62px; border-radius: 14px; overflow: hidden; display: grid; place-items: center; background: linear-gradient(160deg, var(--panel2), var(--track)); cursor: pointer; }
.portrait canvas { width: 100%; height: 100%; }
.portrait .stars { position: absolute; bottom: -9px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--gold); letter-spacing: -1px; text-shadow: 0 1px 2px #000; }
.lvl-badge { position: absolute; top: -6px; right: -8px; background: var(--accent); color: var(--accent-text); font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 13px; padding: 1px 7px; border-radius: 10px; border: 2px solid var(--panel); }
.hero-info { flex: 1; min-width: 0; }
.hero-name { font-family: 'Pixelify Sans', monospace; font-size: 19px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hero-title { color: var(--accent-2); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-left: 6px; }
.xpbar { height: 14px; border-radius: 8px; background: var(--track); overflow: hidden; position: relative; margin-top: 5px; border: 1px solid var(--border); }
.xpbar > i { display: block; height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, var(--xp-2), var(--xp)); transition: width .9s cubic-bezier(.2,.8,.2,1); position: relative; }
.xpbar > i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.35), transparent 60%); }
.xpbar > span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--text); text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.hud-stats { display: flex; gap: 10px; }
.stat-pill { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--border); white-space: nowrap; position: relative; }
.stat-pill b { font-family: 'Pixelify Sans', monospace; font-size: 18px; }
.stat-pill .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); display: block; line-height: 1; }
.stat-pill .bump { animation: bump .5s; }
.coin-icon { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6b0, var(--gold) 45%, #a8760a); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); flex: none; }
.tokens { display: flex; gap: 3px; margin-left: 2px; }
.token { width: 10px; height: 10px; border-radius: 3px; background: var(--track); border: 1px solid var(--border); }
.token.on { background: var(--accent-2); border-color: var(--accent-2); box-shadow: 0 0 6px var(--accent-2); }
.hud-actions { display: flex; gap: 6px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); display: grid; place-items: center; font-size: 16px; transition: transform .15s, background .15s; }
.icon-btn:hover { background: var(--card-hover); transform: translateY(-1px); }
.icon-btn.off { opacity: .55; }
.icon-btn.on { border-color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 22%, var(--panel2)); box-shadow: 0 0 12px color-mix(in srgb, var(--accent-2) 40%, transparent); }
.banner.holiday { border-color: color-mix(in srgb, var(--accent-2) 55%, var(--border)); background: linear-gradient(120deg, color-mix(in srgb, var(--accent-2) 16%, var(--panel2)), var(--panel2) 70%); }
.day.holiday { background: color-mix(in srgb, var(--accent-2) 12%, var(--panel)); }
.day .hol { font-size: 10px; color: var(--accent-2); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }

/* ---- Nav ---- */
.nav-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; border: 1px solid transparent; background: none; text-align: left; color: var(--muted); font-weight: 600; transition: background .15s, color .15s; }
.nav-btn .ico { width: 22px; text-align: center; font-size: 16px; }
.nav-btn:hover { background: var(--card); color: var(--text); }
.nav-btn.active { background: var(--card); color: var(--text); border-color: var(--border); box-shadow: inset 3px 0 0 var(--accent); }
.nav-btn .count { margin-left: auto; font-size: 11px; background: var(--chip); padding: 0 7px; border-radius: 8px; color: var(--muted); }
.nav-sep { height: 1px; background: var(--border); margin: 10px 6px; }
.nav-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 10px; }

/* ---- Generic components ---- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); font-weight: 600; transition: transform .12s, background .15s, box-shadow .15s; white-space: nowrap; }
.btn:hover { background: var(--card-hover); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--hp); }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.chip.diff { color: #fff; }
.chip.example { background: color-mix(in srgb, var(--accent-2) 22%, transparent); color: var(--accent-2); }
.chip.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.chip.fire { background: color-mix(in srgb, var(--hp-2) 20%, transparent); color: var(--hp-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.bar { height: 10px; border-radius: 6px; background: var(--track); overflow: hidden; border: 1px solid var(--border); }
.bar > i { display: block; height: 100%; border-radius: 6px; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.bar.hp > i { background: linear-gradient(90deg, var(--hp), var(--hp-2)); }
.bar.xp > i { background: linear-gradient(90deg, var(--xp-2), var(--xp)); }
.empty { text-align: center; padding: 22px; color: var(--muted); border: 1px dashed var(--border); border-radius: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

/* forms */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field > label, .lbl-sm { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
input[type=text], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea {
  background: var(--track); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; outline: none; transition: border-color .15s, box-shadow .15s; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
textarea { resize: vertical; min-height: 60px; }
input[type=color] { width: 38px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--track); padding: 2px; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg button { padding: 6px 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--track); font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.seg button.area-pick.on { background: color-mix(in srgb, var(--ac) 28%, var(--track)); border-color: var(--ac); color: var(--text); }
.seg button.area-pick.on::before { content: "✓ "; font-weight: 800; }
.seg button.diff-btn.on { color: #fff; background: var(--dc); border-color: var(--dc); }
.seg button small { display: block; font-size: 10px; opacity: .85; font-weight: 500; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.toggle input { display: none; }
.toggle .sw { width: 38px; height: 22px; border-radius: 12px; background: var(--track); border: 1px solid var(--border); position: relative; transition: background .2s; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.toggle input:checked + .sw { background: var(--accent); border-color: var(--accent); }
.toggle input:checked + .sw::after { transform: translateX(16px); background: #fff; }

/* ---- View header ---- */
.view-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.view-head .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.section { margin-top: 24px; }
.section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.section-head h2 { display: flex; align-items: center; gap: 8px; }
.section-head .count { color: var(--muted); font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; }

/* banners */
.banner { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel2); margin-bottom: 10px; }
.banner .ico { font-size: 20px; }
.banner.info { border-color: color-mix(in srgb, var(--accent-2) 40%, var(--border)); }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--border)); background: color-mix(in srgb, var(--warn) 8%, var(--panel2)); }

/* load indicator */
.load { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--border); }
.load .bar { flex: 1; height: 12px; }
.load .bar > i { background: linear-gradient(90deg, var(--good), var(--accent-2)); }
.load.heavy .bar > i { background: linear-gradient(90deg, var(--warn), var(--hp-2)); }
.load .lbl { font-size: 12px; color: var(--muted); white-space: nowrap; }
.load b { font-family: 'Pixelify Sans', monospace; font-size: 17px; }

/* ---- Quest cards ---- */
.quest-list { display: flex; flex-direction: column; gap: 8px; }
.quest { display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); transition: background .15s, transform .15s, opacity .3s, border-color .2s; position: relative; }
.quest:hover { background: var(--card-hover); }
/* drag-to-reorder */
.drag-handle { display: none; touch-action: none; cursor: grab; color: var(--muted); font-size: 13px; letter-spacing: -3px; line-height: 1; padding: 6px 4px; border-radius: 6px; user-select: none; opacity: .35; transition: opacity .15s, background .15s; }
.drag-handle:hover { opacity: 1; background: color-mix(in srgb, var(--text) 8%, transparent); }
.drag-handle:active { cursor: grabbing; }
[data-sortable] > [data-sort-id] > .drag-handle, [data-sortable] > [data-sort-id] .boss-handle { display: inline-block; }
[data-sortable] > .quest[data-sort-id] { padding-left: 26px; }
.quest > .drag-handle { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); }
.boss-card .boss-handle { position: absolute; left: 4px; top: 6px; }
[data-sortable] > .boss-card[data-sort-id] { padding-left: 22px; }
.quest:hover > .drag-handle, .sub:hover > .drag-handle, .boss-card:hover .boss-handle { opacity: .8; }
[data-sort-id].dragging { opacity: .35; }
[data-sort-id].drop-before { box-shadow: 0 -3px 0 0 var(--accent); }
[data-sort-id].drop-after { box-shadow: 0 3px 0 0 var(--accent); }
.quest::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--qcol, var(--border)); }
.quest.done { opacity: .62; }
.quest.done .q-title { text-decoration: line-through; text-decoration-color: var(--muted); }
.check { width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--qcol, var(--border)); background: var(--track); display: grid; place-items: center; padding: 0; transition: transform .15s, background .2s; flex: none; }
.check svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .05s; }
.check:hover { transform: scale(1.08); }
.done .check, .sub.done .check { background: var(--qcol, var(--good)); }
.done .check svg, .sub.done .check svg { stroke-dashoffset: 0; }
.q-title { font-weight: 600; font-size: 14.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.q-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.q-notes { font-size: 12.5px; color: var(--muted); margin-top: 4px; white-space: pre-wrap; }
.q-reward { text-align: right; font-size: 12px; line-height: 1.3; white-space: nowrap; }
.q-reward .x { color: var(--xp); font-weight: 700; }
.q-reward .g { color: var(--gold); font-weight: 700; }
.q-actions { display: flex; gap: 4px; opacity: .55; transition: opacity .15s; }
.quest:hover .q-actions { opacity: 1; }
.mini-btn { border: 1px solid var(--border); background: var(--panel2); border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 600; color: var(--muted); transition: color .15s, background .15s; }
.mini-btn:hover { color: var(--text); background: var(--card-hover); }
.mini-btn.start { color: var(--accent-2); border-color: color-mix(in srgb, var(--accent-2) 45%, var(--border)); }
/* quest steps (checklist) */
.steps { display: flex; flex-direction: column; gap: 2px; margin-top: 7px; }
.step { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 6px; border-radius: 7px; background: none; border: 0; color: var(--text); text-align: left; width: fit-content; max-width: 100%; }
.step:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
.step .box { width: 17px; height: 17px; border-radius: 5px; border: 2px solid var(--qcol, var(--border)); background: var(--track); display: grid; place-items: center; flex: none; transition: background .15s; }
.step .box svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 3.5; fill: none; opacity: 0; transition: opacity .15s; }
.step.on .box { background: var(--qcol, var(--good)); }
.step.on .box svg { opacity: 1; }
.step.on .t { text-decoration: line-through; color: var(--muted); }
.counter { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.counter b { font-family: 'Pixelify Sans', monospace; font-size: 17px; min-width: 52px; text-align: center; }
.counter .mini-btn { min-width: 30px; font-size: 14px; }
.counter .pips { display: flex; gap: 3px; }
.counter .pip { width: 10px; height: 10px; border-radius: 3px; background: var(--track); border: 1px solid var(--border); }
.counter .pip.on { background: var(--qcol); border-color: var(--qcol); }
.counter .pip.extra { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 6px color-mix(in srgb, var(--gold) 60%, transparent); }
.quest.done.counted { opacity: .9; }
.step-edit { display: grid; grid-template-columns: 26px minmax(0,1fr) 34px; gap: 6px; align-items: center; margin-bottom: 6px; }
.step-edit input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
.step-edit.on input[type=text] { text-decoration: line-through; opacity: .7; }

/* completion pop */
.just-done { animation: questPop .55s cubic-bezier(.2,1.6,.4,1); }
.just-done .check { animation: checkPop .5s cubic-bezier(.2,1.8,.4,1); }
@keyframes questPop { 0% { transform: scale(1); } 35% { transform: scale(1.025); box-shadow: 0 0 0 3px var(--qcol), 0 0 30px var(--qcol); } 100% { transform: scale(1); } }
@keyframes checkPop { 0% { transform: scale(.6) rotate(-15deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes bump { 0%{ transform: scale(1);} 40%{ transform: scale(1.35);} 100%{ transform: scale(1);} }
.spark { position: fixed; width: 7px; height: 7px; border-radius: 2px; pointer-events: none; z-index: 60; animation: spark .7s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) rotate(200deg) scale(.3); opacity: 0; } }

/* ---- Boss cards ---- */
.boss-card { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 16px; padding: 16px; border-radius: 16px; background: linear-gradient(135deg, color-mix(in srgb, var(--hp) 10%, var(--card)), var(--card) 55%); border: 1px solid color-mix(in srgb, var(--hp) 30%, var(--border)); position: relative; }
.boss-card.defeated { background: var(--card); border-color: var(--border); opacity: .8; }
.boss-card.engaged { box-shadow: 0 0 0 2px var(--hp), 0 0 24px color-mix(in srgb, var(--hp) 35%, transparent); }
.boss-thumb { width: 96px; height: 86px; border-radius: 12px; background: radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--hp) 22%, transparent), transparent 70%), var(--track); }
.boss-name { font-family: 'Pixelify Sans', monospace; font-size: 18px; font-weight: 700; }
.boss-foe { color: var(--hp-2); font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
.boss-hp { display: flex; align-items: center; gap: 10px; margin: 10px 0 8px; }
.boss-hp .bar { flex: 1; height: 14px; }
.boss-hp .num { font-family: 'Pixelify Sans', monospace; font-size: 14px; white-space: nowrap; }
.subs { display: flex; flex-direction: column; gap: 4px; }
.sub { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 10px; transition: background .15s; }
.sub:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.sub .check { width: 24px; height: 24px; border-radius: 8px; }
.sub .check svg { width: 14px; height: 14px; }
.sub.done .s-title { text-decoration: line-through; color: var(--muted); }
.sub .s-title { flex: 1; min-width: 0; }
.sub .dmg { font-size: 11px; color: var(--hp-2); font-weight: 700; white-space: nowrap; }
.boss-foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.boss-bonus { font-size: 12px; color: var(--muted); }
.boss-bonus b { color: var(--gold); }

/* ---- Campaign map ---- */
.campaign { padding: 18px; border-radius: 18px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 18px; }
.map { position: relative; height: 230px; margin-top: 10px; border-radius: 14px; background:
  radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 40%),
  radial-gradient(circle at 80% 70%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 40%), var(--track); overflow: hidden; border: 1px solid var(--border); }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-node { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; width: 130px; text-align: center; cursor: pointer; }
.map-node canvas { width: 64px; height: 56px; border-radius: 14px; background: var(--panel2); border: 2px solid var(--border); transition: transform .2s; }
.map-node:hover canvas { transform: scale(1.08); }
.map-node.defeated canvas { border-color: var(--good); filter: grayscale(.6) brightness(.8); }
.map-node.current canvas { border-color: var(--hp); box-shadow: 0 0 18px color-mix(in srgb, var(--hp) 60%, transparent); animation: nodePulse 2s infinite; }
.map-node.locked canvas { filter: grayscale(1) brightness(.55); }
.map-node .n-label { font-size: 12px; font-weight: 600; line-height: 1.2; }
.map-node .n-state { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
.map-node.defeated .n-state { color: var(--good); } .map-node.current .n-state { color: var(--hp); }
@keyframes nodePulse { 50% { box-shadow: 0 0 4px color-mix(in srgb, var(--hp) 30%, transparent); } }

/* ---- Calendar ---- */
.cal-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.cal-week { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; }
.cal-month { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
.cal-dow { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.day { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px; min-height: 120px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: border-color .15s, background .15s; position: relative; min-width: 0; }
.cal-week .day { min-height: 380px; }
.day:hover { border-color: var(--accent); }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day.past { opacity: .7; }
.day.other { opacity: .4; }
.day.drop { background: color-mix(in srgb, var(--accent) 15%, var(--panel)); border-style: dashed; }
.day-num { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-family: 'Pixelify Sans', monospace; font-size: 15px; }
.day-num .add { opacity: 0; font-size: 16px; color: var(--accent); transition: opacity .15s; }
.day:hover .day-num .add { opacity: 1; }
.day-load { font-size: 10px; color: var(--muted); }
.day-load.heavy { color: var(--warn); font-weight: 700; }
.cal-chip { font-size: 11.5px; padding: 3px 7px; border-radius: 7px; background: var(--card); border-left: 3px solid var(--qcol, var(--border)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: grab; }
.cal-chip.done { opacity: .5; text-decoration: line-through; }
.cal-chip.daily { cursor: pointer; border-left-style: dotted; background: transparent; color: var(--muted); }
.cal-chip.boss { background: color-mix(in srgb, var(--hp) 18%, var(--card)); border-left-color: var(--hp); cursor: pointer; }
.cal-chip.dragging { opacity: .35; }
.cal-more { font-size: 11px; color: var(--muted); padding-left: 4px; }

/* ---- Shop ---- */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.reward { padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; position: relative; transition: transform .15s; }
.reward:hover { transform: translateY(-2px); }
.reward .r-icon { font-size: 34px; line-height: 1; }
.reward .r-name { font-weight: 700; font-size: 15px; }
.reward .r-cost { display: flex; align-items: center; gap: 6px; font-family: 'Pixelify Sans', monospace; font-size: 18px; color: var(--gold); }
.reward .r-edit { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.reward:hover .r-edit { opacity: 1; }
.reward.claimed { opacity: .55; }
table.log { width: 100%; border-collapse: collapse; font-size: 13px; }
table.log td, table.log th { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
table.log th { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }

/* ---- Trophies ---- */
.trophy-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.trophy { padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
.trophy .t-icon { font-size: 38px; width: 70px; height: 70px; margin: 0 auto 8px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--gold) 30%, transparent), transparent 70%); }
.trophy .t-name { font-family: 'Pixelify Sans', monospace; font-size: 16px; font-weight: 700; }
.trophy .t-desc { font-size: 12px; color: var(--muted); margin-top: 3px; }
.trophy .t-date { font-size: 11px; color: var(--gold); margin-top: 6px; }
.trophy.locked { opacity: .45; } .trophy.locked .t-icon { filter: grayscale(1); background: var(--track); }
.trophy.unlocked { border-color: color-mix(in srgb, var(--gold) 45%, var(--border)); }

/* ---- Inventory ---- */
.inv-layout { display: grid; grid-template-columns: 240px minmax(0,1fr); gap: 20px; align-items: start; }
.inv-preview { position: sticky; top: 0; text-align: center; }
.inv-preview canvas { width: 176px; height: 256px; }
.item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.item { padding: 10px; border-radius: 14px; background: var(--card); border: 2px solid var(--border); text-align: center; cursor: pointer; transition: transform .15s, border-color .15s; font-size: 13px; font-weight: 600; }
.item:hover { transform: translateY(-2px); }
.item.equipped { border-color: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.item.locked { opacity: .4; cursor: not-allowed; }
.item .i-prev { height: 52px; display: grid; place-items: center; margin-bottom: 6px; }
.item .i-prev canvas { width: 48px; height: 48px; }
.item .i-lvl { font-size: 11px; color: var(--muted); font-weight: 500; }
.swatch { width: 52px; height: 40px; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border: 1px solid rgba(255,255,255,.15); }

/* portrait frames */
.frame-plain { box-shadow: 0 0 0 2px var(--border); }
.frame-bronze { box-shadow: 0 0 0 3px #b87333, 0 0 0 5px #5a3412; }
.frame-silver { box-shadow: 0 0 0 3px #d9dee8, 0 0 0 5px #6b7385, 0 0 10px rgba(220,230,255,.35); }
.frame-gold { box-shadow: 0 0 0 3px #ffd34d, 0 0 0 5px #8a6410, 0 0 16px rgba(255,210,80,.55); }
.frame-runic { box-shadow: 0 0 0 3px #b06cff, 0 0 0 5px #3b1670, 0 0 18px rgba(176,108,255,.7); animation: runic 3s ease-in-out infinite; }
.frame-celestial { box-shadow: 0 0 0 3px #8ff4ff, 0 0 0 6px #2b4fa8, 0 0 22px rgba(143,244,255,.7); animation: runic 4s ease-in-out infinite; }
.frame-prismatic { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #ff5ec4, 0 0 26px rgba(255,94,196,.6); animation: prism 5s linear infinite; }
@keyframes runic { 50% { filter: brightness(1.25); } }
@keyframes prism { 0% { filter: hue-rotate(0); } 100% { filter: hue-rotate(360deg); } }

/* ---- Recap ---- */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tile { padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); }
.tile .t-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.tile .t-val { font-family: 'Pixelify Sans', monospace; font-size: 28px; font-weight: 700; margin-top: 2px; }
.tile .t-sub { font-size: 12px; color: var(--muted); }
.chart svg { width: 100%; height: auto; display: block; }

/* ---- Side panel: battle ---- */
.battle { border-radius: 18px; overflow: hidden; border: 1px solid var(--border); background: var(--panel); box-shadow: var(--shadow); }
.battle-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-family: 'Pixelify Sans', monospace; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--border); }
.battle-head .live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.stage { position: relative; width: 340px; height: 234px; margin: 0 auto; overflow: hidden; }
.stage canvas { width: 340px; height: 234px; display: block; }
.stage-overlay { position: absolute; inset: 0; pointer-events: none; }
.boss-bar { position: absolute; top: 8px; left: 10px; right: 10px; padding: 6px 8px; border-radius: 10px; background: rgba(8,8,20,.72); color: #fff; backdrop-filter: blur(2px); transition: opacity .4s, transform .4s; }
.boss-bar.off { opacity: 0; transform: translateY(-10px); }
.boss-bar .bb-name { font-family: 'Pixelify Sans', monospace; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.boss-bar .bb-name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.boss-bar .bb-name span:last-child { white-space: nowrap; }
.boss-bar .bar { height: 10px; margin-top: 4px; border-color: rgba(255,255,255,.2); background: rgba(0,0,0,.5); }
.boss-bar .bar > i { transition: width .7s cubic-bezier(.3,.9,.3,1); background: linear-gradient(90deg, #ff3d5e, #ff9a4d); }
.boss-bar .bar.ghost { position: relative; }
.battle-caption { padding: 10px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--border); min-height: 44px; display: flex; align-items: center; gap: 8px; }
.battle-caption b { color: var(--text); }
.float-txt { position: absolute; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 20px; color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px rgba(0,0,0,.6); transform: translate(-50%, -50%); animation: floatUp 1.1s ease-out forwards; white-space: nowrap; }
.float-txt.dmg { color: #ffe066; font-size: 24px; }
.float-txt.crit { color: #ff6b6b; font-size: 30px; }
.float-txt.xp { color: #7cf0b9; font-size: 16px; }
.float-txt.gold { color: #ffd34d; font-size: 16px; }
.float-txt.lvl { color: #c9b6ff; font-size: 18px; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -70%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -260%) scale(1); } }
.coin-pop { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6b0, #f7c948 45%, #a8760a); box-shadow: 0 0 6px rgba(255,210,80,.8); animation: coinPop .9s cubic-bezier(.2,.7,.4,1) forwards; }
@keyframes coinPop { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 20% { opacity: 1; } 55% { transform: translate(calc(var(--dx) * .7), var(--dy)) scale(1); } 100% { transform: translate(var(--dx), 20px) scale(.8); opacity: 0; } }
.banner-txt { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); font-family: 'Pixelify Sans', monospace; font-size: 38px; font-weight: 700; color: #ffe066; text-shadow: 0 3px 0 #7a3b00, 0 0 20px rgba(255,200,60,.8); animation: bannerIn 2.2s ease-out forwards; white-space: nowrap; }
@keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%,-50%) scale(2.2); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-70%) scale(1); } }

/* areas */
.areas { padding: 14px; }
.area-row { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 8px; align-items: center; margin-bottom: 9px; }
.area-row .a-ico { font-size: 16px; text-align: center; }
.area-row .a-name { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
.area-row .a-lvl { font-family: 'Pixelify Sans', monospace; font-size: 13px; color: var(--muted); }

<script>
/* =====================================================================
   3. CORE — pure game logic. No DOM access in this block, so it can be
   unit-tested in isolation (see QF.runTests at the bottom).
   ===================================================================== */
'use strict';
const QF = (() => {

  // ---------- Tunables ----------
  const STORAGE_KEY = 'questforge.save.v1';
  const DIFFICULTIES = {
    trivial: { id: 'trivial', name: 'Trivial', xp: 5,   gold: 2,  dmg: 5   },
    easy:    { id: 'easy',    name: 'Easy',    xp: 10,  gold: 5,  dmg: 10  },
    medium:  { id: 'medium',  name: 'Medium',  xp: 25,  gold: 10, dmg: 25  },
    hard:    { id: 'hard',    name: 'Hard',    xp: 50,  gold: 20, dmg: 50  },
    epic:    { id: 'epic',    name: 'Epic',    xp: 100, gold: 40, dmg: 100 },
  };
  const DIFF_ORDER = ['trivial', 'easy', 'medium', 'hard', 'epic'];
  // Streak XP bonus tiers, checked from the top down.
  const STREAK_TIERS = [ { days: 14, pct: 30 }, { days: 7, pct: 20 }, { days: 3, pct: 10 } ];
  const TOKEN_EVERY = 7;        // earn one Rest token every 7 consecutive active days
  const MAX_TOKENS = 3;
  const FOCUS_BONUS_XP = 3;     // "Just Start" bonus
  const LOAD_LIMIT_MIN = 360;   // > 6h planned = gentle warning
  const LOAD_LIMIT_HEAVY = 3;   // > 3 Hard/Epic quests = gentle warning
  const BOSS_CHEST_BASE = 50;   // extra gold in a boss chest on top of the sub-quest gold
  const RANKS = [ { level: 15, name: 'Legend' }, { level: 10, name: 'Champion' }, { level: 6, name: 'Knight' }, { level: 3, name: 'Adventurer' }, { level: 1, name: 'Novice' } ];

  // ---------- Dates (all local time, keys are 'YYYY-MM-DD') ----------
  const pad = n => String(n).padStart(2, '0');
  function dateKey(d = new Date()) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  // Noon avoids DST edge cases when adding days.
  function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0); }
  function addDays(k, n) { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); }
  function daysBetween(a, b) { return Math.round((parseKey(b) - parseKey(a)) / 86400000); } // b - a
  function weekday(k) { return parseKey(k).getDay(); }                 // 0 = Sunday
  function weekStart(k) { return addDays(k, -((weekday(k) + 6) % 7)); } // Monday of that week
  function monthStart(k) { return k.slice(0, 8) + '01'; }
  function addMonths(k, n) { const d = parseKey(monthStart(k)); d.setMonth(d.getMonth() + n); return dateKey(d); }

  // ---------- XP & levels ----------
  // XP needed to go from `level` to `level + 1`.
  function xpToNext(level, coef = 100) { return Math.round(coef * Math.pow(level, 1.5)); }
  // Turns a lifetime XP total into { level, into (XP into this level), need (XP for this level), pct }.
  function levelInfo(totalXp, coef = 100) {
    let level = 1, rem = Math.max(0, Math.floor(totalXp || 0));
    while (rem >= xpToNext(level, coef)) { rem -= xpToNext(level, coef); level++; if (level > 999) break; }
    const need = xpToNext(level, coef);
    return { level, into: rem, need, pct: need ? rem / need : 0 };
  }
  function totalXpForLevel(level, coef = 100) { let t = 0; for (let l = 1; l < level; l++) t += xpToNext(l, coef); return t; }
  const AREA_COEF = 50; // life areas level up on a gentler (faster) curve
  function areaLevelInfo(xp) { return levelInfo(xp, AREA_COEF); }
  function rankTitle(level) { return RANKS.find(r => level >= r.level).name; }

  function streakBonusPct(streak) { const t = STREAK_TIERS.find(t => streak >= t.days); return t ? t.pct : 0; }
  // Rewards for completing a quest of `difficulty` while on a streak of `streak` days (including today).
  // Counted Daily Quests (e.g. "Apply to 3 jobs"): every one done PAST the daily target earns
  // a bonus worth that quest's per-unit share of the reward, plus 50% for going the extra mile.
  const EXTRA_MULT = 1.5;
  function extraReward(difficulty, target, streak = 0) {
    const d = DIFFICULTIES[difficulty] || DIFFICULTIES.easy, t = Math.max(1, target || 1), pct = streakBonusPct(streak);
    const baseXp = Math.max(1, Math.round(d.xp / t * EXTRA_MULT));
    return { baseXp, pct, xp: Math.round(baseXp * (1 + pct / 100)), gold: Math.max(1, Math.round(d.gold / t * EXTRA_MULT)) };
  }
  function questReward(difficulty, streak = 0) {
    const d = DIFFICULTIES[difficulty] || DIFFICULTIES.easy;
    const pct = streakBonusPct(streak);
    return { baseXp: d.xp, pct, xp: Math.round(d.xp * (1 + pct / 100)), gold: d.gold };
  }

  // ---------- Boss maths ----------
  function subDamage(sub) { return (DIFFICULTIES[sub.difficulty] || DIFFICULTIES.easy).dmg; }
  // doneIds: Set of completed sub-quest ids.
  function bossStats(boss, doneIds) {
    let maxHp = 0, dealt = 0, done = 0;
    for (const s of boss.subs) { const d = subDamage(s); maxHp += d; if (doneIds.has(s.id)) { dealt += d; done++; } }
    return { maxHp, hp: maxHp - dealt, dealt, done, total: boss.subs.length, pct: maxHp ? (maxHp - dealt) / maxHp : 0, defeated: boss.subs.length > 0 && done === boss.subs.length };
  }
  // Victory bonus: 2x the combined base XP of the sub-quests, and a chest of their gold + 50.
  function bossBonus(boss) {
    let xp = 0, gold = 0;
    for (const s of boss.subs) { const d = DIFFICULTIES[s.difficulty] || DIFFICULTIES.easy; xp += d.xp; gold += d.gold; }
    return { xp: xp * 2, gold: gold + BOSS_CHEST_BASE };
  }

  // ---------- Streaks ----------
  // Replays every day from the first active day to `today`, so the result is always
  // consistent with history (undo just works). A missed past day is covered by Rest
  // tokens only if the WHOLE gap can be covered; otherwise the streak quietly resets
  // and no tokens are spent. Today never breaks a streak (it is still in progress).
  // graceYesterday: quests can be ticked the morning after, so while NOTHING has been done
  // yet today, a blank yesterday is treated as "still pending" rather than missed.
  // isFrozen(day): holiday days. An inactive frozen day never breaks the streak and never uses a
  // Rest token — the streak just pauses. Completing quests on holiday still grows it.
  function computeStreak(activeDates, today, assumeActiveToday = false, graceYesterday = false, isFrozen = null) {
    const frozen = typeof isFrozen === 'function' ? isFrozen : () => false;
    const active = new Set(activeDates);
    if (assumeActiveToday) active.add(today);
    const pendingY = graceYesterday && !active.has(today) && !active.has(addDays(today, -1));
    const cutoff = pendingY ? addDays(today, -1) : today;
    const res = { current: 0, best: 0, tokens: 0, tokensEarned: 0, protectedDays: [], frozenDays: [], breaks: [], perDay: {}, activeToday: active.has(today) };
    const keys = [...active].filter(k => k <= today).sort();
    if (!keys.length) return res;
    let cur = 0, best = 0, tokens = 0, earned = 0;
    let d = keys[0];
    while (d <= today) {
      if (active.has(d)) {
        cur++; if (cur > best) best = cur;
        if (cur % TOKEN_EVERY === 0) { earned++; tokens = Math.min(MAX_TOKENS, tokens + 1); }
        res.perDay[d] = cur; d = addDays(d, 1);
      } else if (frozen(d)) {
        res.frozenDays.push(d); res.perDay[d] = cur; d = addDays(d, 1);
      } else if (d < cutoff) {
        let gap = 0, g = d; const missed = [];
        while (g < cutoff && !active.has(g)) { if (!frozen(g)) { gap++; missed.push(g); } g = addDays(g, 1); }
        if (cur > 0 && gap <= tokens) {

        } else {

          cur = 0;
          for (let x = d; x < g; x = addDays(x, 1)) res.perDay[x] = 0;
        }
        d = g;
      } else { res.perDay[d] = cur; d = addDays(d, 1); } // today (or graced yesterday), not yet active
    }

  }
  // Streak for a single Daily Quest: consecutive *scheduled* days completed.

  function habitStreak(schedule, doneDates, today, graceYesterday = false) {

    for (let i = 0; i < 800; i++, d = addDays(d, -1)) {

      break;                                                 // a past scheduled day was skipped
    }

  }

  // ---------- Quests & history helpers ----------
  // Holidays: [{ start, end }] inclusive date keys.
  const onHoliday = (holidays, day) => (holidays || []).some(h => h.start <= day && day <= h.end);

  // Builds quick lookups from the history log.

    const daily = new Map();      // `${questId}@${date}` -> event
    const focus = new Set();      // `${questId}@${date}` focus bonus already claimed
    for (const e of history) {
      if (e.kind === 'quest' && e.qtype === 'daily') daily.set(e.questId + '@' + e.date, e);
      else if (e.kind === 'quest' || e.kind === 'boss') once.set(e.questId, e);
      else if (e.kind === 'focus') focus.add(e.questId + '@' + e.date);

  }
  // Life areas of a history event (older events only have `area`). A multi-area quest gives its
  // full XP to EACH of its areas — e.g. a walk with a friend grows both Fitness and Social.
  const areasOf = e => (Array.isArray(e.areas) && e.areas.length) ? e.areas : (e.area ? [e.area] : []);

  // Aggregates the whole log into totals (XP, gold, per-area XP, counts).
  function totals(state) {
    const t = { xp: 0, earnedGold: 0, spentGold: 0, gold: 0, areaXp: {}, quests: 0, bosses: 0, focus: 0, extras: 0, byArea: {}, epic: 0 };
    for (const e of state.history) {
      t.xp += e.xp || 0; t.earnedGold += e.gold || 0;
      const ar = areasOf(e);
      for (const a of ar) t.areaXp[a] = (t.areaXp[a] || 0) + (e.xp || 0);
      if (e.kind === 'quest') { t.quests++; for (const a of ar) t.byArea[a] = (t.byArea[a] || 0) + 1; if (e.difficulty === 'epic') t.epic++; }

      if (e.kind === 'focus') t.focus++;
      if (e.kind === 'extra') t.extras++;

    for (const p of state.purchases) t.spentGold += p.cost;

  }
  // Sum of time estimates and Hard/Epic count for a day, with the gentle warning flag.

    return { minutes, heavy, overloaded: minutes > LOAD_LIMIT_MIN || heavy > LOAD_LIMIT_HEAVY };
  }

  // ---------- Weekly recap ----------
  function weekRecap(state, startKey) {
    const end = addDays(startKey, 6), prevStart = addDays(startKey, -7), prevEnd = addDays(startKey, -1);
    const r = { start: startKey, end, xp: 0, quests: 0, bosses: 0, goldEarned: 0, goldSpent: 0, perDay: [], areaXp: {}, prevAreaXp: {}, bestStreak: 0, topArea: null, prevXp: 0 };

      } else if (e.date >= prevStart && e.date <= prevEnd) {

    let best = null;

  }

  // ---------- Sync merge ----------
  // Combines this device's save with the cloud copy. Completions (history) and purchases are
  // merged by id — so XP/gold from every device adds up — except ids deleted by an undo on any
  // device ("tombstones"). Every other section (quests, bosses, settings…) takes whichever
  // device edited it most recently (meta.secTimes). Achievements keep the earliest unlock.

      for (const x of [...(local[k] || []), ...(remote[k] || [])]) if (x && !tomb.has(x.id) && !byId.has(x.id)) byId.set(x.id, x);
      out[k] = clone([...byId.values()].sort((a, b) => (a.ts || 0) - (b.ts || 0)));
      out.meta.tomb[k] = [...tomb].slice(-5000);
    }
    const ach = { ...(remote.achievements || {}) };
    for (const [id, d] of Object.entries(local.achievements || {})) if (!ach[id] || d < ach[id]) ach[id] = d;
    out.achievements = ach;
    if (out.profile) { out.profile.maxLevel = Math.max((local.profile || {}).maxLevel || 1, (remote.profile || {}).maxLevel || 1); out.profile.setupDone = !!((local.profile || {}).setupDone || (remote.profile || {}).setupDone); }

    return out;
  }

  }

  return {

/* =====================================================================
   6. SOUND — tiny synth built on the Web Audio API (no audio files).

const Sound = (() => {
  let ctx = null, master = null;
  function init() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();

  }
  function tone(freq, start, dur, type = 'square', vol = 0.05, endFreq = null, attack = 0.005) {

    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);

const fmtClock = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

// Picks what the battle panel should show.
function syncBattle() {
  const eng = UIState.engagedBoss && findBoss(UIState.engagedBoss);
  if (eng && !bossDefeated(eng)) return Battle.setEncounter(bossDesc(eng));
  UIState.engagedBoss = null;
  const { dailies, sides, isDone } = todaysPlan();

  }
  const next = [...dailies, ...sides].find(q => !isDone(q));
  if (next) Battle.setEncounter({ type: 'monster', key: next.id, difficulty: next.difficulty, title: next.title });
  else Battle.setEncounter(null, dailies.length + sides.length ? 'clear' : 'empty');

// Steps are a simple checklist inside a quest. On Daily Quests they reset each day.
const stepDone = (q, st) => q.type === 'daily' ? st.doneDate === UIState.today : !!st.doneDate;

}
// Counted Daily Quests: how many done today (target reached = quest complete; beyond = extras).
const targetOf = q => q.type === 'daily' ? Math.max(1, +q.target || 1) : 1;
function tallyOf(q) {
  const t = targetOf(q), raw = q.tally && q.tally.date === UIState.today ? q.tally.n : 0;
  const done = QF.indexHistory(S.history).daily.has(q.id + '@' + UIState.today);
  return done ? Math.max(t, raw) : Math.min(raw, t - 1);
}
function counterHTML(q) {

  const pips = Array.from({ length: Math.min(Math.max(n, t), 20) }, (_, i) => `<span class="pip ${i < Math.min(n, t) ? 'on' : i < n ? 'extra' : ''}"></span>`).join('');
  return `<div class="counter"><button class="mini-btn" data-act="count-down" data-id="${q.id}" title="Take one back" ${n ? '' : 'disabled'}>−</button><b>${n} / ${t}</b>
    <button class="mini-btn start" data-act="count-up" data-id="${q.id}" title="${n >= t ? 'Did another one? Bonus reward!' : 'Log one more'}">＋ 1</button><span class="pips">${pips}</span>
    ${extra ? `<span class="chip fire">🚀 +${extra} extra</span>` : ''}<span class="tiny muted">${n >= t ? `each extra: +${ex.xp} XP, +${ex.gold} gold` : `${t - n} to go · extras past ${t} earn +${ex.xp} XP each`}</span></div>`;
}

      h += `<div class="campaign"><div class="row"><div><h2>🗺️ ${esc(c.name)} ${c.example ? '<span class="chip example">example</span>' : ''}</h2><div class="small muted" style="margin-top:3px">${esc(c.desc || '')}</div></div><span class="spacer"></span>
        <span class="chip">${Math.min(stage, n)}/${n} bosses defeated</span><button class="btn sm ghost" data-act="edit-campaign" data-id="${c.id}">✎ Edit</button></div>
        ${campaignMap(c, stage)}
        ${cur ? `<div style="margin-top:14px">${bossCard(cur)}</div>` : n ? `<div class="banner" style="margin-top:14px"><span class="ico">🏆</span><div><b>Campaign complete!</b> Every boss has fallen. Legendary work.</div></div>` : `<div class="empty" style="margin-top:14px">This campaign has no bosses yet. <button class="btn sm" data-act="edit-campaign" data-id="${c.id}">Add bosses</button></div>`}
      </div>`;

    const solo = S.bosses.filter(b => !campaignOf(b.id) && !bossDefeated(b));
    h += `<section class="section"><div class="section-head"><h2>⚔️ Standalone Bosses</h2><span class="count">${solo.length}</span></div>
      <div class="quest-list" style="gap:12px" data-sortable="boss">${solo.length ? solo.map(b => bossCard(b)).join('') : '<div class="empty">No standalone bosses. Summon one for your next big task!</div>'}</div></section>`;
    const fallen = S.bosses.filter(b => bossDefeated(b));
    if (fallen.length) h += `<section class="section"><div class="section-head"><h2>🏛️ Hall of Fallen Foes</h2><span class="count">${fallen.length}</span></div>
      <div class="card" style="padding:6px 14px">${fallen.map(b => { const ev = D.idx.once.get(b.id); return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)"><canvas class="px" data-sprite="boss:${b.creature}:${b.palette || 0}" width="44" height="40" data-pad="2"></canvas><div style="flex:1"><b>${esc(b.name)}</b><div class="tiny muted">${esc(b.foe || '')}</div></div><span class="small muted">${ev && ev.kind === 'boss' ? 'Defeated ' + fmtDate(ev.date) : ''}</span><button class="btn sm ghost" data-act="open-boss" data-id="${b.id}">View</button></div>`; }).join('')}</div></section>`;
    return h;
  },

  shop() {
    const gold = D.t.gold, owned = new Set(S.purchases.map(p => p.rewardId));

        <div class="r-icon">${esc(r.icon || '🎁')}</div><div class="r-name">${esc(r.name)}</div>

  trophies() {
    const got = Object.keys(S.achievements).length;
    return `<div class="view-head"><div><h1>Trophy Room</h1><div class="sub">${got} of ${ACHIEVEMENTS.length} achievements unlocked</div></div></div>
      <div class="trophy-grid">${ACHIEVEMENTS.map(a => { const d = S.achievements[a.id]; return `<div class="trophy ${d ? 'unlocked' : 'locked'}"><div class="t-icon">${a.icon}</div><div class="t-name">${a.name}</div><div class="t-desc">${a.desc}</div>${d ? `<div class="t-date">Unlocked ${fmtDate(d)}</div>` : '<div class="t-date" style="color:var(--faint)">🔒 Locked</div>'}</div>`; }).join('')}</div>`;
  },

  inventory() {
    const lvl = S.profile.maxLevel, next = UNLOCKS.filter(u => u.level > lvl).sort((a, b) => a.level - b.level)[0];
    let h = `<div class="view-head"><div><h1>Inventory</h1><div class="sub">Level up to unlock themes, titles, frames and gear. Click an item to equip it.</div></div></div>
      <div class="inv-layout"><div class="card inv-preview"><div class="portrait frame-${gearNow().frame}" style="width:190px;height:220px;margin:6px auto 14px;cursor:default"><canvas class="px" data-sprite="hero" width="168" height="204" data-pad="0" style="width:168px;height:204px"></canvas></div>
        <div class="hero-name" style="font-size:22px">${esc(S.profile.name)}</div><div class="hero-title" style="margin:0">${esc(displayTitle())} · Lv ${D.lv.level}</div>
        <button class="btn sm" style="margin-top:12px" data-act="edit-look">🎨 Change look</button>
        ${next ? `<div class="small muted" style="margin-top:12px">Next unlock at <b>Lv ${next.level}</b>: ${esc(next.name)}</div>` : `<div class="small muted" style="margin-top:12px">Everything unlocked! Each new level adds a ★.</div>`}</div><div>`;
    for (const { type, label } of UNLOCK_TYPES) {

  recap() {
    const cur = QF.weekStart(D.today); if (!UIState.recapWeek) UIState.recapWeek = cur;
    const wk = UIState.recapWeek;
    return `<div class="view-head"><div><h1>Weekly Recap</h1><div class="sub">Week of ${fmtDate(wk, false)} – ${fmtDate(QF.addDays(wk, 6), false)}</div></div><div class="spacer"></div>
      <button class="btn sm" data-act="recap-prev">◀ Previous</button><button class="btn sm" data-act="recap-cur">This week</button><button class="btn sm" data-act="recap-next" ${wk >= cur ? 'disabled' : ''}>Next ▶</button></div>` + recapHTML(wk);

  settings() {
    const st = S.settings;
    let h = `<div class="view-head"><div><h1>Settings</h1><div class="sub">Profile, life areas, sound, and your data.</div></div></div><div class="grid2" style="align-items:start">`;
    h += `<div class="card"><h3>🧙 Profile</h3><div class="field" style="margin-top:12px"><label>Hero name</label><input type="text" data-change="name" value="${esc(S.profile.name)}" maxlength="30"></div><button class="btn" data-act="edit-look">🎨 Change look</button></div>`;
    h += `<div class="card"><h3>🔊 Sound, motion & look</h3><div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
      <div class="row wrap"><button class="btn sm" data-act="toggle-light">🌓 Light / dark theme</button><button class="btn sm" data-act="holiday">🏖️ Holiday mode</button></div>
      <label class="toggle"><input type="checkbox" data-change="sound" ${st.sound ? 'checked' : ''}><span class="sw"></span>Sound effects</label>
      <label class="toggle"><input type="checkbox" data-change="timerSound" ${st.timerSound ? 'checked' : ''}><span class="sw"></span>Gentle bell when a focus timer ends <span class="tiny muted">(separate from sound effects)</span></label>
      <div class="field" style="margin:0"><label>Reduce motion</label><select data-change="reduceMotion"><option value="auto" ${st.reduceMotion === 'auto' ? 'selected' : ''}>Follow my system setting</option><option value="on" ${st.reduceMotion === 'on' ? 'selected' : ''}>On — tone animations down</option><option value="off" ${st.reduceMotion === 'off' ? 'selected' : ''}>Off — full animations</option></select></div></div></div>`;
    h += `</div><div class="card" style="margin-top:14px"><div class="row"><h3>🧭 Life Areas</h3><span class="spacer"></span><button class="btn sm" data-act="area-add">＋ Add area</button></div>
      <div class="small muted" style="margin:6px 0 12px">Rename, recolour or remove areas. Removing one moves its quests to another area (earned XP stays in your history).</div>
      ${S.areas.map(a => `<div class="row" style="margin-bottom:8px"><input type="text" data-change="area-icon" data-id="${a.id}" value="${esc(a.icon)}" maxlength="4" style="width:56px;text-align:center"><input type="text" data-change="area-name" data-id="${a.id}" value="${esc(a.name)}" maxlength="24"><input type="color" data-change="area-color" data-id="${a.id}" value="${a.color}"><button class="btn sm ghost danger" data-act="area-remove" data-id="${a.id}" ${S.areas.length <= 1 ? 'disabled' : ''}>Remove</button></div>`).join('')}</div>`;
    h += `<div class="card" id="syncCard" style="margin-top:14px">${syncCardHTML()}</div>`;
    h += `<div class="card" style="margin-top:14px"><h3>💾 Your data</h3><div class="small muted" style="margin:6px 0 12px">Everything is stored in this browser (localStorage key <code>${QF.STORAGE_KEY}</code>). Export a backup now and then.</div>
      <div class="row wrap"><button class="btn primary" data-act="export">💾 Export backup (JSON)</button><button class="btn" data-act="import">📂 Import backup</button><button class="btn" data-act="clear-examples">🧪 Clear examples</button><button class="btn" data-act="clear-all-quests">🧹 Remove all quests & bosses</button><span class="spacer"></span><button class="btn danger" data-act="reset-all">Reset everything…</button></div></div>`;
    const tr = UIState.testResults;
    h += `<div class="card" style="margin-top:14px"><div class="row"><h3>🧪 Logic self-tests</h3><span class="spacer"></span><button class="btn sm" data-act="run-tests">Run self-tests</button></div>
      <div class="small muted" style="margin-top:6px">Checks XP maths, level thresholds, streaks & rest tokens, daily resets and boss HP.</div>

function dayCell(k, mode, other) {
  const today = D.today, idx = D.idx, past = k < today;
  const dailies = S.quests.filter(q => scheduledOn(q, k));
  const bossDl = S.bosses.filter(b => b.deadline === k && !bossDefeated(b));
  const load = QF.dayLoad(k >= today ? dailies : []);
  const items = bossDl.map(b => `<div class="cal-chip boss" draggable="true" data-drag="${b.id}" data-act="edit-boss" data-id="${b.id}" title="Boss deadline: ${esc(b.name)} — drag to move it">💀 ${esc(b.name)}</div>`);
  if (mode === 'week') {
    items.push(...dailies.map(q => { const done = idx.daily.has(q.id + '@' + k); return `<div class="cal-chip daily ${done ? 'done' : ''}" data-act="edit-quest" data-id="${q.id}" title="Daily Quest">🔁 ${esc(q.title)}</div>`; }));
  } else if (dailies.length) { const dn = dailies.filter(q => idx.daily.has(q.id + '@' + k)).length; items.push(`<div class="cal-more">🔁 ${past || k === today ? dn + '/' : ''}${dailies.length} dailies</div>`); }
  const max = mode === 'week' ? 99 : 3, shown = items.slice(0, max), more = items.length - shown.length;
  const d = QF.parseKey(k);
  const hd = holidayOn(k);
  return `<div class="day ${k === today ? 'today' : ''} ${past ? 'past' : ''} ${other ? 'other' : ''} ${hd ? 'holiday' : ''}" data-day="${k}" ${past ? 'title="Past day"' : 'data-act="day" title="Click to set a boss deadline on this day"'}>
    <div class="day-num"><span>${mode === 'week' ? `${DAY_SHORT[d.getDay()]} ${d.getDate()}` : d.getDate()}</span>${past ? '' : '<span class="add">＋</span>'}</div>${hd ? `<div class="hol" title="${hd.name ? esc(hd.name) : 'Holiday'}">🏖️ ${mode === 'week' && hd.name ? esc(hd.name) : 'Holiday'}</div>` : ''}
    ${!past && load.minutes ? `<div class="day-load ${load.overloaded ? 'heavy' : ''}">${load.overloaded ? '⚠ ' : ''}${fmtMin(load.minutes)}${load.heavy ? ' · ' + load.heavy + ' hard' : ''}</div>` : (!past && load.overloaded ? `<div class="day-load heavy">⚠ ${load.heavy} hard</div>` : '')}
    ${shown.join('')}${more > 0 ? `<div class="cal-more">+${more} more</div>` : ''}</div>`;
}

function campaignMap(c, stage) {
  const n = c.bossIds.length; if (!n) return '';
  const pts = c.bossIds.map((_, i) => [n === 1 ? 50 : 9 + i * (82 / (n - 1)), i % 2 ? 66 : 34]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
  const donePath = pts.slice(0, Math.min(stage, n - 1) + 1).map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' ');
  return `<div class="map"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="2 2" vector-effect="non-scaling-stroke" style="stroke-width:3px"/>
    ${stage > 0 ? `<path d="${donePath}" fill="none" stroke="var(--good)" vector-effect="non-scaling-stroke" style="stroke-width:3px"/>` : ''}</svg>
    ${c.bossIds.map((id, i) => { const b = findBoss(id); if (!b) return ''; const state = i < stage ? 'defeated' : i === stage ? 'current' : 'locked';
      return `<div class="map-node ${state}" style="left:${pts[i][0]}%;top:${pts[i][1]}%" data-act="open-boss" data-id="${b.id}" title="${esc(b.foe || '')}"><canvas class="px" data-sprite="boss:${b.creature}:${b.palette || 0}" width="64" height="56" data-pad="2"></canvas>
        <div class="n-label">${i + 1}. ${esc(b.name)}</div><div class="n-state">${state === 'defeated' ? '✓ Defeated' : state === 'current' ? '⚔ Current' : '🔒 Upcoming'}</div></div>`; }).join('')}</div>`;
}

function itemTile(u) {
  const unlocked = S.profile.maxLevel >= u.level, eq = u.type === 'title' ? S.equipped.title === u.id : gearNow()[u.type] === u.id || (u.type === 'theme' && S.equipped.theme === u.id);
  let prev;
  if (u.type === 'theme') prev = `<div class="swatch"><span style="background:${u.swatch[0]}"></span><span style="background:${u.swatch[1]}"></span></div>`;
  else if (u.type === 'title') prev = `<div class="pixel" style="font-size:14px;color:var(--accent-2)">“${esc(u.id === 'auto' ? QF.rankTitle(D.lv.level) : u.name)}”</div>`;
  else if (u.type === 'frame') prev = `<div class="portrait frame-${u.id}" style="width:40px;height:40px;border-radius:10px;cursor:inherit"></div>`;
  else if (u.type === 'aura') prev = u.id === 'none' ? '<div style="font-size:26px;opacity:.5">⊘</div>' : `<div style="width:42px;height:42px;border-radius:50%;background:radial-gradient(circle, ${u.id === 'arcane' ? '#b06cff' : '#ffd34d'}, transparent 70%)"></div>`;
  else if (u.type === 'weapon') prev = `<canvas class="px" data-sprite="weapon:${u.id}" width="40" height="48" data-pad="2" style="width:40px;height:48px"></canvas>`;
  else prev = `<canvas class="px" data-sprite="gear:${u.type}:${u.id}" width="56" height="68" data-pad="0" style="width:44px;height:54px"></canvas>`;
  return `<div class="item ${eq ? 'equipped' : ''} ${unlocked ? '' : 'locked'}" ${unlocked ? `data-act="equip" data-type="${u.type}" data-id="${u.id}"` : ''} title="${unlocked ? 'Click to equip' : 'Unlocks at level ' + u.level}">
    <div class="i-prev">${prev}</div><div>${esc(u.name)}</div><div class="i-lvl">${unlocked ? (eq ? '✓ Equipped' : 'Lv ' + u.level) : '🔒 Level ' + u.level}</div></div>`;
}

function recapHTML(wk, compact = false) {
  const r = QF.weekRecap(S, wk), delta = r.xp - r.prevXp;
  const tiles = [
    ['XP earned', r.xp.toLocaleString(), r.prevXp || r.xp ? `${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)} vs last week` : ''],
    ['Quests completed', r.quests, ''], ['Bosses defeated', r.bosses, ''], ['Best streak', r.bestStreak + (r.bestStreak === 1 ? ' day' : ' days'), ''],
    ['Gold earned', r.goldEarned.toLocaleString(), ''], ['Gold spent', r.goldSpent.toLocaleString(), r.goldSpent ? 'treats enjoyed 🎉' : ''],
  ];
  let h = `<div class="tiles">${tiles.map(([l, v, s]) => `<div class="tile"><div class="t-lbl">${l}</div><div class="t-val">${v}</div><div class="t-sub">${s}</div></div>`).join('')}</div>`;
  const max = Math.max(10, ...r.perDay.map(d => d.xp)), W = 560, H = 190, bw = 52, gap = (W - 7 * bw) / 8;
  h += `<div class="card chart" style="margin-top:14px"><h3 style="margin-bottom:8px">XP per day</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="XP per day bar chart">
    <defs><linearGradient id="xpg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--xp)"/><stop offset="1" stop-color="var(--xp-2)"/></linearGradient></defs>
    <line x1="0" y1="${H - 26}" x2="${W}" y2="${H - 26}" stroke="var(--border)"/>
    ${r.perDay.map((d, i) => { const hh = Math.round((H - 50) * d.xp / max), x = gap + i * (bw + gap), y = H - 26 - hh, isToday = d.date === D.today;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(hh, 2)}" rx="6" fill="${d.xp ? 'url(#xpg)' : 'var(--track)'}" opacity="${d.date > D.today ? 0.35 : 1}"/>
        ${d.xp ? `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">${d.xp}</text>` : ''}
        <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${isToday ? 'var(--accent)' : 'var(--muted)'}" font-weight="${isToday ? 700 : 400}">${DAY_SHORT[QF.weekday(d.date)]}</text>`; }).join('')}</svg></div>`;
  const top = r.topArea ? areaOf(r.topArea.id) : null;
  h += `<div class="card" style="margin-top:14px"><h3>🌟 Life area growth</h3>
    ${top ? `<div class="banner info" style="margin:10px 0"><span class="ico">${esc(top.icon)}</span><div><b>${esc(top.name)}</b> grew the most: +${r.topArea.now} XP this week${r.topArea.prev ? ` (${r.topArea.delta >= 0 ? '+' : ''}${r.topArea.delta} vs last week)` : ' (up from nothing last week!)'}.</div></div>` : '<div class="small muted" style="margin:8px 0">No area XP this week yet.</div>'}
    ${compact ? '' : `<table class="log"><tr><th>Area</th><th>This week</th><th>Last week</th><th>Change</th></tr>${S.areas.map(a => { const n = r.areaXp[a.id] || 0, p = r.prevAreaXp[a.id] || 0, dd = n - p; return `<tr><td>${esc(a.icon)} ${esc(a.name)}</td><td>${n} XP</td><td class="muted">${p} XP</td><td style="color:${dd > 0 ? 'var(--good)' : dd < 0 ? 'var(--muted)' : 'var(--faint)'}">${dd > 0 ? '+' : ''}${dd}</td></tr>`; }).join('')}</table>`}</div>`;
  return h;
}

/* ---------- modal system ---------- */
const Modal = {
  live: null, locked: false, onClose: null,
  open(html, { wide = false, onMount = null, live = null, locked = false, onClose = null } = {}) {
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-back"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
    this.live = live; this.locked = locked; this.onClose = onClose;
    const back = root.firstElementChild; back.addEventListener('mousedown', e => { if (e.target === back && !this.locked) this.close(); });
    const m = $('.modal', root); hydrate(m); animateBars(m); onMount && onMount(m);
    const f = $('[autofocus]', m); if (f) setTimeout(() => f.focus(), 30);
  },
  close() { const root = $('#modalRoot'); if (!root.innerHTML) return; root.innerHTML = ''; this.live = null; this.locked = false; const oc = this.onClose; this.onClose = null; oc && oc(); setTimeout(() => Celebrate.flush(), 300); },
  isOpen() { return !!$('#modalRoot').innerHTML; },
  refresh() { if (this.live) { const m = $('#modalRoot .modal'); if (m) { m.innerHTML = this.live(); hydrate(m); animateBars(m); } } },
};
// Celebrations (level-up, victory, weekly recap) wait politely until no modal is open.
const Celebrate = {
  q: [],
  push(fn, delay = 0) { setTimeout(() => { this.q.push(fn); this.flush(); }, delay); },
  flush() { if (Modal.isOpen() || !this.q.length) return; this.q.shift()(); },
};
function confirmDialog(title, body, okLabel, onOk, danger = false) {
  Modal.open(`<h2>${title}</h2><div>${body}</div><div class="modal-foot"><button class="btn" data-act="modal-close">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="confirmOk">${okLabel}</button></div>`,
    { onMount: m => { $('#confirmOk', m).onclick = () => { Modal.close(); onOk(m); }; } });
}
const segVal = (root, name) => { const s = $(`[data-seg="${name}"]`, root); if (!s) return null; return s.dataset.multi ? $$('button.on', s).map(b => b.dataset.val) : (s.dataset.value || ''); };
const segBtns = (opts, cur, attrs = () => '', cls = () => '') => opts.map(([val, label]) => `<button type="button" data-val="${val}" class="${cls(val)} ${String(val) === String(cur) ? 'on' : ''}" ${attrs(val)}>${label}</button>`).join('');

// Multi-select life-area buttons (each area has a ✓ when picked). Read with segVal(m, 'area') → array.
const areaPicker = sel => `<div class="seg" data-seg="area" data-multi="1">${S.areas.map(a => `<button type="button" data-val="${a.id}" class="area-pick ${sel.includes(a.id) ? 'on' : ''}" style="--ac:${a.color}">${esc(a.icon)} ${esc(a.name)}</button>`).join('')}</div>
  <div class="small muted" style="margin-top:4px">Each area you pick gets the quest's full XP.</div>`;
function openQuestModal(init = {}) {
  const q = init.id ? findQuest(init.id) : null, today = UIState.today;
  const v = q ? { ...q, days: q.days || [0, 1, 2, 3, 4, 5, 6] } : { type: 'daily', when: init.when || (isHoliday(today) ? 'holiday' : 'normal'), title: '', notes: '', difficulty: 'easy', days: [0, 1, 2, 3, 4, 5, 6], estimate: '', energy: '' };
  v.areas = q ? itemAreas(q) : itemAreas({ area: UIState.lastArea });
  const html = `<h2>${q ? '✎ Edit Daily Quest' : '＋ New Daily Quest'}</h2>${q ? '' : '<p class="small muted" style="margin:-8px 0 14px">For small, everyday tasks. Got something bigger? <a href="#" data-act="add-boss">Make it a Boss Battle</a> and break it into sub-quests.</p>'}<form>
    <div class="field"><label>Title</label><input type="text" name="title" maxlength="120" value="${esc(v.title)}" placeholder="e.g. Go for a 30-minute walk" autofocus required></div>
    <div class="field"><label>Difficulty</label><div class="seg" data-seg="difficulty" data-value="${v.difficulty}">${segBtns(QF.DIFF_ORDER.map(d => [d, `${QF.DIFFICULTIES[d].name}<small>+${QF.DIFFICULTIES[d].xp} XP · ${QF.DIFFICULTIES[d].gold}g</small>`]), v.difficulty, d => `style="--dc:${DIFF_COLOR[d]}"`, () => 'diff-btn')}</div></div>
    <div class="field"><label>Life areas <span style="text-transform:none;letter-spacing:0;font-weight:500">— pick one or more</span></label>${areaPicker(v.areas)}</div>
    <div class="field"><label>Active on</label><div class="seg" data-seg="when" data-value="${v.when || 'normal'}">${segBtns([['normal', '🏠 Normal days'], ['holiday', '🏖️ Holidays only'], ['always', '🧳 Both']], v.when || 'normal')}</div>
      <div class="small muted" style="margin-top:4px">Normal-day quests pause while you're on holiday; holiday-only quests appear just on holiday days.</div></div>
    <div class="field when-daily"><label>Repeats on</label><div class="row wrap"><div class="seg days-pick" data-seg="days" data-multi="1">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button type="button" data-val="${d}" class="${v.days.includes(d) ? 'on' : ''}">${DAY_SHORT[d]}</button>`).join('')}</div>
      <button type="button" class="btn sm ghost" data-preset="0,1,2,3,4,5,6">Every day</button><button type="button" class="btn sm ghost" data-preset="1,2,3,4,5">Weekdays</button><button type="button" class="btn sm ghost" data-preset="0,6">Weekends</button></div>
      <div class="small muted" style="margin-top:4px">Resets every morning at midnight. Missing a day never costs anything.</div></div>
    <div class="field when-daily"><label>Daily target (how many times a day?)</label><div class="row"><input type="number" name="target" min="1" max="50" step="1" value="${Math.max(1, +v.target || 1)}" style="max-width:90px"><span class="small muted" id="targetHint"></span></div></div>
    <div class="grid2"><div class="field"><label>Time estimate (minutes)</label><input type="number" name="estimate" min="0" max="1440" step="5" value="${v.estimate || ''}" placeholder="optional, e.g. 30"></div>
      <div class="field"><label>Energy needed</label><div class="seg" data-seg="energy" data-value="${v.energy || ''}" data-toggle-off="1">${segBtns(ENERGY.map(e => [e.id, e.icon + ' ' + e.name]), v.energy || '')}</div></div></div>
    <div class="field"><label>Steps (optional checklist)</label><div id="stepList"></div>
      <div class="row"><button type="button" class="btn sm" id="addStep">＋ Add step</button><span class="small muted" id="stepHint"></span></div></div>
    <div class="field"><label>Notes</label><textarea name="notes" maxlength="1000" placeholder="optional">${esc(v.notes || '')}</textarea></div>
    <div class="small" id="formErr" style="color:var(--hp)"></div>
    <div class="modal-foot">${q ? `<button type="button" class="btn ghost danger" data-act="delete-quest" data-id="${q.id}">Delete</button><span class="spacer"></span>` : ''}<button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" class="btn primary">${q ? 'Save changes' : 'Add quest'}</button></div></form>`;
  const steps = ((q && q.steps) || []).map(st => ({ ...st }));
  Modal.open(html, { onMount(m) {
    const form = $('form', m), list = $('#stepList', m);
    const on = st => st.doneDate === today;
    const drawSteps = () => {
      list.innerHTML = steps.map((st, i) => `<div class="step-edit ${on(st) ? 'on' : ''}"><input type="checkbox" data-tick="${i}" ${on(st) ? 'checked' : ''} title="Mark step done"><input type="text" data-i="${i}" value="${esc(st.text)}" placeholder="Step ${i + 1}" maxlength="140"><button type="button" class="mini-btn" data-rm="${i}" title="Remove step">✕</button></div>`).join('');
      $('#stepHint', m).textContent = steps.length ? 'Ticks reset each day along with the quest. Press Enter in a step to add the next one.' : 'Break the quest into small, tickable steps.';
    };
    const addStep = after => { const at = after == null ? steps.length : after + 1; steps.splice(at, 0, { id: uid(), text: '', doneDate: '' }); drawSteps(); list.querySelectorAll('input[type=text]')[at].focus(); };
    list.addEventListener('input', e => { const i = e.target.dataset.i; if (i != null) steps[i].text = e.target.value; });
    list.addEventListener('change', e => { const i = e.target.dataset.tick; if (i != null) { steps[i].doneDate = e.target.checked ? today : ''; drawSteps(); } });
    list.addEventListener('click', e => { const i = e.target.dataset.rm; if (i != null) { steps.splice(+i, 1); drawSteps(); } });
    list.addEventListener('keydown', e => { const i = e.target.dataset.i; if (i != null && e.key === 'Enter') { e.preventDefault(); addStep(+i); } });
    $('#addStep', m).onclick = () => addStep();
    m.addEventListener('segchange', drawSteps); drawSteps();
    const targetHint = () => {
      const t = Math.max(1, Math.round(+form.target.value || 1)), d = segVal(m, 'difficulty') || 'easy', ex = QF.extraReward(d, t);
      $('#targetHint', m).innerHTML = t < 2 ? 'Set e.g. <b>3</b> for “apply to 3 jobs” — you get a +1 counter, and every one past the target earns bonus XP & gold.'
        : `Reaching ${t} completes the quest (+${QF.DIFFICULTIES[d].xp} XP). Every extra after that: <b style="color:var(--xp)">+${ex.xp} XP</b> & <b style="color:var(--gold)">+${ex.gold} gold</b>.`;
    };
    form.target.addEventListener('input', targetHint); m.addEventListener('segchange', targetHint); targetHint();
    $$('[data-preset]', m).forEach(b => b.onclick = () => { const set = b.dataset.preset.split(','); $$('[data-seg="days"] button', m).forEach(x => x.classList.toggle('on', set.includes(x.dataset.val))); });
    form.onsubmit = e => {
      e.preventDefault();
      const data = { target: Math.min(50, Math.max(1, Math.round(+form.target.value || 1))), type: 'daily', title: form.title.value.trim(), notes: form.notes.value.trim(), difficulty: segVal(m, 'difficulty'), areas: segVal(m, 'area'), estimate: form.estimate.value ? Math.max(0, Math.round(+form.estimate.value)) : '', energy: segVal(m, 'energy') };
      if (!data.title) { $('#formErr', m).textContent = 'Give your quest a title.'; form.title.focus(); return; }
      if (!data.areas.length) { $('#formErr', m).textContent = 'Pick at least one life area.'; return; } data.area = data.areas[0];
      data.when = segVal(m, 'when') || 'normal'; data.days = segVal(m, 'days').map(Number); if (!data.days.length) { $('#formErr', m).textContent = 'Pick at least one day for this Daily Quest.'; return; }
      data.steps = steps.map(st => ({ ...st, text: st.text.trim() })).filter(st => st.text);
      Modal.close(); A.saveQuest(data, q && q.id);
    };
  } });
}

const FOE_A = ['Gloom', 'Dread', 'Grim', 'Ash', 'Thorn', 'Mire', 'Frost', 'Ember', 'Shadow', 'Iron', 'Murk', 'Rust', 'Storm', 'Bramble', 'Dusk'];
const FOE_B = ['maw', 'fang', 'claw', 'wing', 'scale', 'horn', 'spine', 'gore', 'jaw', 'hide'];
const FOE_C = ['the Unfinished', 'Devourer of Weekends', 'the Looming', 'Keeper of Excuses', 'the Daunting', 'Lord of Someday', 'the Procrastinator', 'Warden of the To-Do List', 'the Ever-Postponed', 'Eater of Deadlines'];
const randomFoe = () => `${pick(FOE_A)}${pick(FOE_B)}, ${pick(FOE_C)}`;

function openBossModal(init = {}) {

  const draft = b ? JSON.parse(JSON.stringify(b)) : { name: '', foe: randomFoe(), creature: pick(creatures), palette: 0, deadline: init.deadline || '', subs: [{ id: uid(), title: '', difficulty: 'medium' }, { id: uid(), title: '', difficulty: 'medium' }, { id: uid(), title: '', difficulty: 'hard' }] };

        <div class="field"><label>Creature</label><div class="seg" data-seg="creature" data-value="${draft.creature}">${segBtns(creatures.map(c => [c, Art.BOSS_TYPES[c].name]), draft.creature)}</div></div></div>
      <div style="text-align:center"><canvas id="bossPrev" class="px" width="144" height="128" style="width:144px;height:128px;border-radius:14px;background:var(--track)"></canvas><button type="button" class="btn sm" id="palBtn" style="margin-top:6px">🎨 <span id="palName"></span></button></div></div>

      <div class="field"><label>Campaign</label><select name="campaign"><option value="">— none (standalone) —</option>${S.campaigns.map(c => `<option value="${c.id}" ${c.id === draft.campaignId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div></div>
    <div class="field"><label>Sub-quests (each one deals damage equal to its difficulty)</label><div id="subList"></div><button type="button" class="btn sm" id="addSub">＋ Add sub-quest</button></div>
    <div class="small muted" id="bossSummary"></div><div class="small" id="formErr" style="color:var(--hp)"></div>
