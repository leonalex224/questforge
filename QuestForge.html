  Modal.open(html, { wide: true, onMount(m) {
    const form = $('form', m), list = $('#subList', m);
    const prev = () => { const T = Art.BOSS_TYPES[draft.creature]; draft.palette = draft.palette % T.pals.length; Art.paintInto($('#bossPrev', m), Art.bossSprites(draft.creature, draft.palette).frames[0], 8); $('#palName', m).textContent = T.pals[draft.palette].label; };
    const summary = () => { const subs = draft.subs.filter(s => s.title.trim()), bb = QF.bossBonus({ subs }); $('#bossSummary', m).innerHTML = `Max HP <b>${subs.reduce((t, s) => t + QF.subDamage(s), 0)}</b> · victory bonus <b>+${bb.xp} XP</b> and a <b>${bb.gold} gold</b> chest (plus normal rewards for each sub-quest).`; };
    const renderSubs = () => {
      list.innerHTML = draft.subs.map((s, i) => `<div class="sub-edit ${D.doneSubs.has(s.id) ? 'isdone' : ''}"><input type="text" data-i="${i}" value="${esc(s.title)}" placeholder="Sub-quest ${i + 1}" maxlength="100">
        <select data-i="${i}">${QF.DIFF_ORDER.map(d => `<option value="${d}" ${d === s.difficulty ? 'selected' : ''}>${QF.DIFFICULTIES[d].name} (⚔${QF.DIFFICULTIES[d].dmg})</option>`).join('')}</select>
        <button type="button" class="mini-btn" data-rm="${i}" title="Remove">✕</button></div>`).join(''); summary();
    };
    list.addEventListener('input', e => { const i = e.target.dataset.i; if (i != null && e.target.tagName === 'INPUT') { draft.subs[i].title = e.target.value; summary(); } });

    list.addEventListener('click', e => { const i = e.target.dataset.rm; if (i != null) { draft.subs.splice(+i, 1); renderSubs(); } });

      e.preventDefault();
      draft.name = form.name.value.trim(); draft.foe = form.foe.value.trim(); draft.areas = segVal(m, 'area'); draft.area = draft.areas[0]; draft.deadline = form.deadline.value; draft.campaignId = form.campaign.value;

      if (!draft.areas.length) { $('#formErr', m).textContent = 'Pick at least one life area.'; return; }
      if (!draft.subs.length) { $('#formErr', m).textContent = 'Add at least one sub-quest — they are how you damage the boss.'; renderSubs(); return; }
      Modal.close(); A.saveBoss(draft, b && b.id);
    };
    prev(); renderSubs();
  } });
}

function openCampaignModal(init = {}) {
  const c = init.id ? S.campaigns.find(x => x.id === init.id) : null;
  const draft = c ? { name: c.name, desc: c.desc || '', bossIds: [...c.bossIds] } : { name: '', desc: '', bossIds: [] };
  const html = `<h2>${c ? '✎ Edit Campaign' : '🗺️ New Campaign'}</h2><form>
    <div class="field"><label>Campaign name</label><input type="text" name="name" maxlength="60" value="${esc(draft.name)}" placeholder="e.g. Get Fit for Summer" autofocus></div>
    <div class="field"><label>Description</label><input type="text" name="desc" maxlength="140" value="${esc(draft.desc)}" placeholder="optional"></div>
    <div class="field"><label>Bosses, in order</label><div id="campList"></div>
      <div class="row" style="margin-top:6px"><select id="campAdd"></select><button type="button" class="btn sm" id="campAddBtn">Add</button></div></div>
    <div class="small" id="formErr" style="color:var(--hp)"></div>
    <div class="modal-foot">${c ? `<button type="button" class="btn ghost danger" id="campDel">Delete campaign</button><span class="spacer"></span>` : ''}<button type="button" class="btn" id="campNewBoss">＋ New boss for this campaign</button><button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>`;
  Modal.open(html, { onMount(m) {
    const form = $('form', m), list = $('#campList', m), sel = $('#campAdd', m);
    const draw = () => {
      list.innerHTML = draft.bossIds.map((id, i) => { const b = findBoss(id); return b ? `<div class="row" style="padding:6px 8px;border:1px solid var(--border);border-radius:10px;margin-bottom:5px"><b style="width:22px">${i + 1}.</b><canvas class="px" data-sprite="boss:${b.creature}:${b.palette || 0}" width="36" height="32" data-pad="1"></canvas><span style="flex:1">${esc(b.name)} ${bossDefeated(b) ? '<span class="chip">✓ defeated</span>' : ''}</span>
        <button type="button" class="mini-btn" data-mv="${i}:-1" ${i ? '' : 'disabled'}>↑</button><button type="button" class="mini-btn" data-mv="${i}:1" ${i < draft.bossIds.length - 1 ? '' : 'disabled'}>↓</button><button type="button" class="mini-btn" data-rm="${i}">✕</button></div>` : ''; }).join('') || '<div class="muted small">No bosses yet.</div>';
      hydrate(list);
      const avail = S.bosses.filter(b => !draft.bossIds.includes(b.id) && (!campaignOf(b.id) || (c && campaignOf(b.id) === c)));
      sel.innerHTML = avail.length ? avail.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('') : '<option value="">(no free bosses — create one)</option>';
    };
    list.addEventListener('click', e => {
      const mv = e.target.dataset.mv, rm = e.target.dataset.rm;
      if (mv) { const [i, d] = mv.split(':').map(Number); const a = draft.bossIds; [a[i], a[i + d]] = [a[i + d], a[i]]; draw(); }
      if (rm != null) { draft.bossIds.splice(+rm, 1); draw(); }
    });
    $('#campAddBtn', m).onclick = () => { if (sel.value) { draft.bossIds.push(sel.value); draw(); } };
    const collect = () => { draft.name = form.name.value.trim(); draft.desc = form.desc.value.trim(); if (!draft.name) { $('#formErr', m).textContent = 'Give the campaign a name.'; return false; } return true; };
    form.onsubmit = e => { e.preventDefault(); if (!collect()) return; Modal.close(); A.saveCampaign(draft, c && c.id); };
    $('#campNewBoss', m).onclick = () => { if (!collect()) return; Modal.close(); const id = A.saveCampaign(draft, c && c.id, true); openBossModal({ campaignId: id }); };
    if (c) $('#campDel', m).onclick = () => confirmDialog('Delete campaign?', `“${esc(c.name)}” will be removed. Its bosses stay as standalone bosses.`, 'Delete', () => A.deleteCampaign(c.id), true);

const snapshot = () => { const t = QF.totals(S); return { t, lv: QF.levelInfo(t.xp), streak: streakCalc(QF.activeDates(S.history), UIState.today, false, true) }; };

function commit(events = [], opts = {}) {

    const from = S.profile.maxLevel, delay = opts.celebrateDelay ?? 1300; S.profile.maxLevel = post.lv.level;
    Battle.levelUp(); setTimeout(() => Sound.play('levelUp'), delay);
    Celebrate.push(() => openLevelUpModal(from, post.lv.level), delay + 200);

  if (!pre.streak.activeToday && post.streak.activeToday && post.streak.current >= 2) {
    const pct = QF.streakBonusPct(post.streak.current);
    setTimeout(() => FX.toast({ icon: '🔥', head: 'Streak', body: `${post.streak.current}-day streak!${pct ? ` Quests now give <b>+${pct}% XP</b>.` : ''}` }), 900);
  } else if (!pre.streak.activeToday && post.streak.activeToday && post.streak.current === 1 && pre.streak.best > 0 && !(pre.streak.pendingYesterday && yesterdayPending().length)) {
    setTimeout(() => FX.toast({ icon: '🌱', head: 'New streak', body: 'Day 1 of a brand new streak. Welcome back!' }), 900);
  }
  if (pre.streak.pendingYesterday && !post.streak.pendingYesterday && post.streak.current < pre.streak.current && yesterdayPending().length)
    setTimeout(() => FX.toast({ icon: '🌙', head: 'Did you do something yesterday?', body: `Tick it under “🌙 Yesterday” on the Today page to keep your ${pre.streak.current}-day streak.`, ms: 8000 }), 1000);
  else if (post.streak.current > pre.streak.current && pre.streak.activeToday === post.streak.activeToday)
    setTimeout(() => FX.toast({ icon: '🔥', head: 'Streak kept alive', body: `Yesterday counted — you're on a ${post.streak.current}-day streak.` }), 900);
  if (post.streak.tokensEarned > pre.streak.tokensEarned) setTimeout(() => FX.toast({ icon: '🛌', head: 'Rest Day token earned', body: 'If you ever miss a day, it will automatically protect your streak.' }), 1600);
  Store.save(); checkAchievements(); render();
}
function achievementContext() {
  const t = QF.totals(S), streak = streakCalc(QF.activeDates(S.history), UIState.today, false, true), dd = new Map();
  for (const e of S.history) if (e.kind === 'quest' && e.qtype === 'daily') { if (!dd.has(e.questId)) dd.set(e.questId, []); dd.get(e.questId).push(e.date); }
  const idx = QF.indexHistory(S.history), done = new Set(); for (const b of S.bosses) for (const s of b.subs) if (idx.once.has(s.id)) done.add(s.id);
  const holidayQuests = S.history.filter(e => e.kind === 'quest' && isHoliday(e.date)).length;
  return { t, streak, holidayQuests, level: QF.levelInfo(t.xp).level, purchases: S.purchases.length, plannedAhead: S.ui.plannedAhead, cleanSweep: S.ui.cleanSweep,
    areaLevels: S.areas.map(a => QF.areaLevelInfo(t.areaXp[a.id] || 0).level),

}
function checkAchievements() {

const A = {
  completeQuest(id) {
    const q = findQuest(id); if (!q) return;
    const today = UIState.today, idx = QF.indexHistory(S.history);
    if (q.type === 'daily' ? idx.daily.has(id + '@' + today) : idx.once.has(id)) return A.undoQuest(id);
    const streak = streakCalc(QF.activeDates(S.history), today, true).current, r = QF.questReward(q.difficulty, streak);
    const ev = { id: uid(), kind: 'quest', qtype: q.type, questId: q.id, title: q.title, ...areaFields(q), difficulty: q.difficulty, date: today, ts: Date.now(), xp: r.xp, gold: r.gold, baseXp: r.baseXp, bonusPct: r.pct };
    Sound.play('complete');
    Battle.questComplete({ questId: q.id, difficulty: q.difficulty, title: q.title, xp: r.xp, gold: r.gold });
    if (q.type === 'daily') { const ds = S.quests.filter(x => scheduledOn(x, today)); if (ds.length >= 3 && ds.every(x => x.id === q.id || idx.daily.has(x.id + '@' + today))) S.ui.cleanSweep = true; }
    const t = targetOf(q); if (t > 1) q.tally = { date: today, n: t };
    commit([ev]); flashDone(q.id);
    if (t > 1) return FX.snack(`🎯 Target hit: ${t}/${t} “${esc(q.title)}”! +${r.xp} XP, +${r.gold} gold. Every extra now earns a bonus.`, 'Undo', () => A.undoQuest(q.id));
    FX.snack(`✓ “${esc(q.title)}” complete! +${r.xp} XP${r.pct ? ` (incl. +${r.pct}% streak bonus)` : ''}, +${r.gold} gold`, 'Undo', () => A.undoQuest(q.id));
  },
  // Tick a Daily Quest for YESTERDAY (e.g. reading in bed, ticked the next morning).
  completeYesterday(id) {
    const q = findQuest(id), day = QF.addDays(UIState.today, -1);
    if (!q || !scheduledOn(q, day)) return;
    if (QF.indexHistory(S.history).daily.has(id + '@' + day)) return;
    const t = targetOf(q), inp = $(`.yest-count[data-for="${id}"]`), count = t > 1 ? Math.min(t + 50, Math.max(t, Math.round(+(inp && inp.value) || t))) : 1;
    const streak = streakCalc(QF.activeDates(S.history), day, true).current, r = QF.questReward(q.difficulty, streak), now = Date.now();
    const base = { kind: 'quest', qtype: 'daily', questId: q.id, title: q.title, ...areaFields(q), difficulty: q.difficulty, date: day, ts: now, backfilled: true };
    const events = [{ ...base, id: uid(), xp: r.xp, gold: r.gold, baseXp: r.baseXp, bonusPct: r.pct }];
    for (let k = 1; k <= count - t; k++) { const e = QF.extraReward(q.difficulty, t, streak); events.push({ ...base, kind: 'extra', id: uid(), xp: e.xp, gold: e.gold, baseXp: e.baseXp, bonusPct: e.pct }); }
    const xp = events.reduce((a, e) => a + e.xp, 0), gold = events.reduce((a, e) => a + e.gold, 0);
    Sound.play('complete'); Battle.questComplete({ questId: q.id + '@' + day, difficulty: q.difficulty, title: q.title, xp, gold });
    commit(events);
    FX.snack(`🌙 “${esc(q.title)}” logged for yesterday${count > 1 ? ` (${count} done)` : ''}: +${xp} XP, +${gold} gold`, 'Undo', () => A.undoYesterday(id));
  },
  undoYesterday(id) {
    const day = QF.addDays(UIState.today, -1), n = S.history.length;
    S.history = S.history.filter(e => !((e.kind === 'quest' || e.kind === 'extra') && e.questId === id && e.date === day));
    if (S.history.length === n) return; Sound.play('undo'); commit(); FX.snack('Undone — no harm done.');
  },
  // "+1" on a counted Daily Quest.
  countUp(id) {
    const q = findQuest(id); if (!q) return;
    const today = UIState.today, t = targetOf(q), n = tallyOf(q);
    if (n < t - 1) {
      q.tally = { date: today, n: n + 1 }; Sound.play('click'); Store.save(); render();
      requestAnimationFrame(() => { const el = $(`.quest[data-qid="${id}"] .counter b`); if (el) { el.classList.remove('bump'); void el.offsetWidth; el.style.animation = 'bump .4s'; FX.sparks(el, getComputedStyle(el).getPropertyValue('--qcol') || '#5ee3a1'); } });
      return FX.snack(`${n + 1}/${t} “${esc(q.title)}” — ${t - n - 1} to go!`, 'Undo', () => A.countDown(id), 3500);
    }
    if (n === t - 1) return A.completeQuest(id);
    // Past the target: bonus reward for each extra.
    const streak = streakCalc(QF.activeDates(S.history), today, true).current, r = QF.extraReward(q.difficulty, t, streak), k = n + 1 - t;
    const ev = { id: uid(), kind: 'extra', qtype: 'daily', questId: q.id, title: q.title, ...areaFields(q), difficulty: q.difficulty, date: today, ts: Date.now(), xp: r.xp, gold: r.gold, baseXp: r.baseXp, bonusPct: r.pct };

/* =====================================================================
   12. SYNC — optional cloud sync between devices, using Supabase.

// Optional: fill these in so every device is pre-connected (you then only sign in).
// Both values are designed to be public — Row Level Security keeps your data private.
// NEVER put the service_role / secret key here.
const SYNC_DEFAULTS = { url: '', key: '' };
const SYNC_STORE = 'questforge.sync.v1'; // this device's sign-in (not part of backups)

const SYNC_SQL = `-- QuestForge cloud save: one row per account, readable and writable only by its owner.
create table if not exists public.questforge_saves (
  user_id uuid primary key default auth.uid() references auth.users (id) on delete cascade,
  data jsonb not null,
  updated_at timestamptz not null default now(),
  device text
);
alter table public.questforge_saves enable row level security;
grant select, insert, update on public.questforge_saves to authenticated;
drop policy if exists "Read own save" on public.questforge_saves;
drop policy if exists "Create own save" on public.questforge_saves;
drop policy if exists "Update own save" on public.questforge_saves;
create policy "Read own save" on public.questforge_saves for select to authenticated using ((select auth.uid()) = user_id);
create policy "Create own save" on public.questforge_saves for insert to authenticated with check ((select auth.uid()) = user_id);
create policy "Update own save" on public.questforge_saves for update to authenticated using ((select auth.uid()) = user_id) with check ((select auth.uid()) = user_id);`;

const Sync = (() => {
  let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(SYNC_STORE)) || {}; } catch (e) { cfg = {}; }
  let status = 'off', busy = false, again = false, pushTimer = null, pollTimer = null;
  const base = { secs: {}, ids: {} };
  const persist = () => { try { localStorage.setItem(SYNC_STORE, JSON.stringify(cfg)); } catch (e) {} };
  const baseUrl = () => String(cfg.url || SYNC_DEFAULTS.url || '').trim().replace(/\/+$/, '');
  const apiKey = () => String(cfg.key || SYNC_DEFAULTS.key || '').trim();
  const configured = () => !!(baseUrl() && apiKey());
  const signedIn = () => configured() && !!cfg.refresh && !!cfg.userId;
  const device = () => /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) ? 'phone' : 'computer';

  // ---- change tracking (Store.save calls this before writing) ----
  function meta(st) { st.meta = st.meta || {}; st.meta.secTimes = st.meta.secTimes || {}; st.meta.tomb = st.meta.tomb || {}; for (const k of ['history', 'purchases']) st.meta.tomb[k] = st.meta.tomb[k] || []; return st.meta; }
  function track(st, init = false) {
    const m = meta(st), now = Date.now();
    for (const sec of SYNC_SECTIONS) { const j = JSON.stringify(st[sec] === undefined ? null : st[sec]); if (!init && sec in base.secs && base.secs[sec] !== j) m.secTimes[sec] = now; base.secs[sec] = j; }
    for (const k of ['history', 'purchases']) {
      const ids = new Set((st[k] || []).map(x => x.id));
      if (!init && base.ids[k]) for (const id of base.ids[k]) if (!ids.has(id)) m.tomb[k].push(id); // removed by an undo/refund
      m.tomb[k] = m.tomb[k].slice(-5000); base.ids[k] = ids;

  // ---- talking to Supabase (plain fetch, no library needed) ----
  async function call(path, { method = 'GET', body, headers = {}, auth = true, keepalive = false } = {}) {

    return data;
  }

    if (!cfg.refresh) { const e = new Error('Please sign in again.'); e.status = 401; throw e; }
    setSession(await call('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: cfg.refresh }, auth: false }));
  }
  function setSession(b) {
    cfg.access = b.access_token; cfg.refresh = b.refresh_token; cfg.expiresAt = Date.now() + (b.expires_in || 3600) * 1000;
    if (b.user) { cfg.userId = b.user.id; cfg.email = b.user.email; } persist();
  }
  const fetchRemote = async () => { const rows = await call('/rest/v1/questforge_saves?select=data,updated_at,device&user_id=eq.' + encodeURIComponent(cfg.userId)); return (rows && rows[0]) || null; };
  const pushRemote = (st, keepalive = false) => call('/rest/v1/questforge_saves?on_conflict=user_id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: { user_id: cfg.userId, data: st, updated_at: new Date().toISOString(), device: device() }, keepalive });

  function setStatus(st, msg) { status = st; if (msg !== undefined) { cfg.lastError = msg; persist(); } renderSyncStatus(); }
  const info = () => ({ configured: configured(), signedIn: signedIn(), email: cfg.email, lastSync: cfg.lastSync, lastError: cfg.lastError, status, url: baseUrl(), baked: !!(SYNC_DEFAULTS.url && SYNC_DEFAULTS.key) });

  // Replace this device's state with a merged / cloud one (without counting it as a local edit).
  function applyState(st) {
    S = st; track(S, true);

    applyTheme(); applyMotion(); Battle.refreshHero(); render();
  }
  const comparable = st => JSON.stringify({ ...st, ui: null, meta: { tomb: st.meta && st.meta.tomb } });

  async function syncNow() {
    if (!signedIn()) { setStatus(configured() ? 'signedout' : 'off'); return; }
    if (busy) { again = true; return; }
    busy = true; clearTimeout(pushTimer); pushTimer = null; setStatus('syncing');

      const remote = await fetchRemote();
      if (!remote) await pushRemote(S);
      else {
        const r = normalizeState(remote.data), merged = QF.mergeStates(S, r, SYNC_SECTIONS), m = comparable(merged);

  function authError(e) {

    if (/not confirmed/i.test(m)) return 'Please confirm your email first: click the link Supabase emailed you, then sign in.';
    if (/already registered|already been registered|already exists/i.test(m)) return 'That email already has an account. Use Sign in instead.';
    if (/signups? not allowed|signup.*disabled/i.test(m)) return 'New sign-ups are turned off for this project.';
    if (/password/i.test(m) && /least|short|weak/i.test(m)) return 'That password is too short or weak. Use at least 6 characters (longer is better).';
    return m;
  }
  async function signIn(email, password) {
    setStatus('syncing');

    catch (e) { setStatus('signedout', authError(e)); return false; }

  }
  async function signUp(email, password) {

  function signOut() { clearTimeout(pushTimer); pushTimer = null; cfg.access = cfg.refresh = cfg.userId = null; cfg.expiresAt = 0; persist(); setStatus(configured() ? 'signedout' : 'off', null); }
  function configure(url, key) { cfg.url = url; cfg.key = key; persist(); setStatus('signedout', null); }
  function forget() { signOut(); cfg.url = cfg.key = ''; persist(); setStatus('off', null); }

  // First sign-in on a device: if a cloud save exists, ask which progress to keep.
  async function firstSync() {
    let remote;

    if (!remote) {
      try { await pushRemote(S); } catch (e) { setStatus('error', e.message); return false; }
      cfg.lastSync = Date.now(); setStatus('ok', null); startPolling();
      FX.toast({ icon: '☁️', head: 'Sync is on', body: 'Your progress is saved to the cloud. Sign in on your other devices with the same account.' }); return true;
    }
    const r = normalizeState(remote.data), choice = await askFirstSync(r, remote);

      for (const k of ['history', 'purchases']) for (const x of r[k] || []) if (!keep[k].has(x.id)) m.tomb[k].push(x.id); // cloud-only items are replaced
      track(S, true); try { localStorage.setItem(QF.STORAGE_KEY, JSON.stringify(S)); } catch (e) {}
      try { await pushRemote(S); } catch (e) { setStatus('error', e.message); return false; }
    }
    cfg.lastSync = Date.now(); setStatus('ok', null); startPolling();
    FX.toast({ icon: '☁️', head: 'Sync is on', body: choice === 'cloud' ? 'Loaded your cloud save on this device.' : "This device's progress is now your cloud save." });
    return true;
  }

  function init() {
    track(S, true);
    window.addEventListener('online', syncNow);
    window.addEventListener('offline', () => { if (signedIn()) setStatus('offline'); });

    window.addEventListener('pagehide', flush);

  return { init, track, changed, syncNow, signIn, signUp, signOut, configure, forget, info };
})();

const SYNC_LABEL = { off: 'Off', signedout: 'Signed out', ok: 'Synced', syncing: 'Syncing…', pending: 'Saving…', offline: 'Offline', error: 'Problem' };

// Runs at startup and whenever the date changes: friendly streak notes + Monday recap.
function dayCheck() {
  const st = streakCalc(QF.activeDates(S.history), UIState.today, false, true);
  for (const d of st.protectedDays) if (!S.ui.seenProtected.includes(d)) { S.ui.seenProtected.push(d); UIState.notes.push({ icon: '🛌', html: `A Rest Day token protected your streak on <b>${fmtDate(d)}</b>. Your ${st.perDay[d] || st.current}-day streak is safe!` }); }
  for (const b of st.breaks) if (!S.ui.seenBreaks.includes(b.date)) { S.ui.seenBreaks.push(b.date); UIState.notes.push({ icon: '🌅', html: `Your ${b.lost}-day streak has come to a rest — that's completely fine, and nothing was lost. Complete any quest today to start a new one!` }); }
  S.ui.seenProtected = S.ui.seenProtected.slice(-100); S.ui.seenBreaks = S.ui.seenBreaks.slice(-100);
  const hNow = holidayOn(UIState.today), hPrev = holidayOn(QF.addDays(UIState.today, -1));
  if (hNow && !S.ui.holidayNotes.includes('start:' + hNow.id)) { S.ui.holidayNotes.push('start:' + hNow.id); UIState.notes.push({ icon: '🏖️', html: `Holiday mode is on${hNow.name ? ' for <b>' + esc(hNow.name) + '</b>' : ''}. Have a wonderful time — your streak is frozen until ${fmtDate(hNow.end)}.` }); }
  if (!hNow && hPrev && !S.ui.holidayNotes.includes('end:' + hPrev.id)) { S.ui.holidayNotes.push('end:' + hPrev.id); UIState.notes.push({ icon: '🏡', html: `Welcome back${hPrev.name ? ' from <b>' + esc(hPrev.name) + '</b>' : ''}! Your ${st.current}-day streak was kept safe, and your normal Daily Quests are back.` }); }
  S.ui.holidayNotes = S.ui.holidayNotes.slice(-50);
  const wk = QF.weekStart(UIState.today);
  if (S.ui.lastRecapWeek !== wk) { S.ui.lastRecapWeek = wk; const prev = QF.addDays(wk, -7); if (S.history.some(e => e.date >= prev && e.date < wk)) Celebrate.push(() => openRecapModal(prev), 800); }
  Store.save();
}

  const t = S.timer;
  if (t && !t.ended && t.pausedLeft == null) {
    if (Date.now() >= t.endsAt) { t.ended = true; Store.save(); Sound.play('timerEnd'); FX.toast({ icon: '⏰', head: 'Focus session complete', body: `${t.durationMin} minutes on “${esc(t.title)}”. Brilliant work!`, ms: 8000 }); renderTimer(); }
    else { const el = $('#timerTime'); if (el) el.textContent = fmtClock(timerLeft()); const ring = $('#timerRing'); if (ring) { const C = 2 * Math.PI * 26; ring.setAttribute('stroke-dashoffset', C * (timerLeft() / (t.durationMin * 60000))); } document.title = '⏱ ' + fmtClock(timerLeft()) + ' · QuestForge'; }
  }
  if (tickN % 15 === 0 && QF.dateKey() !== UIState.today) { // midnight rollover (local time)
    UIState.today = QF.dateKey(); UIState.calAnchor = UIState.today; UIState.recapWeek = null; UIState.engagedBoss = null;
    dayCheck(); render(); FX.toast({ icon: '🌅', head: 'A new day dawns', body: 'Your Daily Quests have reset — no penalties, ever.' });
  }
}
function boot() {
  let st = Store.load();
  const first = !st;
  S = st || defaultState();
  if (first) Object.assign(S, buildExamples(UIState.today));
  applyTheme(); applyMotion();
  Battle.init(); bindEvents();
  if (first) Store.save();
  dayCheck(); render();
  Sync.init();
  if (!S.profile.setupDone) openSetupModal(true);
  setInterval(tick, 1000);
  setInterval(renderSyncStatus, 30000); // keeps "last synced … ago" fresh
  // Offline support + "Add to Home Screen" when the app is hosted over https.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}
boot();
</script>
